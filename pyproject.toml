[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-agent-eval"
version = "0.2.0"
description = "A portable agent evaluation harness with a bounded arXiv research agent"
requires-python = ">=3.9"
readme = "README.md"
dependencies = []

[project.optional-dependencies]
pdf = ["pypdf>=5,<8"]

[project.scripts]
pae = "paper_agent_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
paper_agent_eval = ["data/fixed/*.json", "data/*.json", "pdfkit.swift"]
