name: Offline verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install '.[pdf]'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/audit_release.py
      - run: pae history --output /tmp/history.json
      - run: pae eval --tasks examples/reverse.tasks.jsonl --config examples/reverse.json --out /tmp/reverse-fixture
